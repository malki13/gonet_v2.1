services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  bot_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gonet-platform:dev
    working_dir: /app
    env_file:
      - .env
    command: ["uvicorn", "apps.bot_api.main:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      APP_ENV: ${COMPOSE_APP_ENV:-local}
      MOCK_MODE: ${COMPOSE_MOCK_MODE:-true}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8010:8010"

  worker_ocr:
    profiles:
      - legacy-local-ocr
    build:
      context: .
      dockerfile: Dockerfile
    image: gonet-platform:dev
    working_dir: /app
    env_file:
      - .env
    command: ["python", "-m", "apps.worker_ocr.main"]
    environment:
      APP_ENV: ${COMPOSE_APP_ENV:-local}
      MOCK_MODE: ${COMPOSE_MOCK_MODE:-true}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
