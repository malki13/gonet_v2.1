[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gonet-platform"
version = "0.1.0"
description = "Monorepo base para el orquestador conversacional multiagente de GoNet."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn>=0.35,<1.0",
  "httpx>=0.28,<1.0",
  "asyncpg>=0.30,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "redis>=6.4,<7.0",
  "apscheduler>=3.10,<4.0",
  "openai>=1.107,<2.0",
  "python-dotenv>=1.1,<2.0",
  "cryptography>=45.0,<46.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
]
audio = [
  "faster-whisper>=1.1,<2.0",
  "edge-tts>=7.0,<8.0",
]

[project.scripts]
gonet-bot-api = "apps.bot_api.main:run"
gonet-worker-ocr = "apps.worker_ocr.main:run"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
